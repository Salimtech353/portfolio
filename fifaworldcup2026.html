<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আর্জেন্টিনার বিশ্বকাপ বিতর্ক</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 {
            color: #74b9ff;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        p {
            color: #dfe6e9;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>স্বাগতম!</h1>
        <p>ইতিহাস দেখতে OK চাপুন...</p>
    </div>

    <script>
        // ১. প্রথম অ্যালার্ট: শুধুমাত্র গোল চোর
        alert("⚽️ গোল চোর!!! ⚽️");

        // তথ্যের টেক্সট ভেরিয়েবল
        var infoText = "🇦🇷 আর্জেন্টিনার ৩টি বিশ্বকাপ ও সংক্ষিপ্ত বিতর্ক:\n\n" +
                       "🏆 ১৯৭৮: পেরুর বিপক্ষে ৬-০ গোলের ম্যাচটিতে রাজনৈতিক প্রভাবের বড় অভিযোগ।\n\n" +
                       "🏆 ১৯৮৬: ইংল্যান্ডের বিপক্ষে ম্যারাডোনার হাত দিয়ে করা সেই বিখ্যাত 'Hand of God' গোল।\n\n" +
                       "🏆 २०२२: টুর্নামেন্টে রেকর্ডসংখ্যক পেনাল্টি পাওয়া নিয়ে ব্যাপক ট্রোল ও সমালোচনা।\n\n" +
                       "⚽️ গোল চোর!!! ⚽️";

        // ২. দ্বিতীয় অ্যালার্ট: যা ওকে চাপলে বারবার আসতেই থাকবে
        while (true) {
            alert(infoText);
        }
    </script>

</body>
</html>
